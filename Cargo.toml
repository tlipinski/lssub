[package]
name = "lssub"
edition = "2024"
build = "build.rs"
license-file = "LICENSE"
description = "Teminal UI app for searching and downloading subtitles via the OpenSubtitles API."
repository = "https://github.com/tlipinski/lssub"

[dependencies]
clap = { version = "4.5.24", features = ["derive"] }
toml = "1.0.3"
anyhow = "1.0.102"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros", "fs"] }
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
secrecy = { version = "0.10.3", features = ["serde"] }
env_logger = "0.11.9"
libsecret = { version = "0.9.0", features = ["v0_19"] }
gio = "0.22.2"
ratatui = "0.30.0"
xdg = "2.5.2"
tui-input = "0.15.0"
tui-popup = "0.7.2"
tui-checkbox = "0.4.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.31"
reqwest = { version = "0.12.12", features = ["json"] }
serde_json = "1.0.138"
